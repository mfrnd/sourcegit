name: Auto Rebase & Release
# Vendoring model: for each upstream release tag vX we keep an immutable branch
# `vendor/vX` = that vanilla tag + our feature patches. The `released` pointer
# branch tracks the last vendor branch we successfully built AND released, and is
# the base we rebase the next one from.
#
# Each run: take the newest upstream tag, ensure `vendor/vX` exists (auto-rebase
# `released`'s patches onto vX, or use a human-pre-resolved branch if the rebase
# conflicts), build it, publish vX.<n>, and only then advance `released` -> vendor/vX.
# Scheduled runs must live on the default branch (GitHub rule), hence this is on master.
on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Re-release even if a fork build for the current upstream tag already exists
        type: boolean
        default: false

concurrency:
  group: auto-rebase-release
  cancel-in-progress: false

env:
  POINTER: released
  UPSTREAM_URL: https://github.com/sourcegit-scm/sourcegit.git

jobs:
  prepare:
    name: Prepare vendor branch
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push vendor branch + tag
      issues: write      # open an issue on conflict
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      fork_tag: ${{ steps.plan.outputs.fork_tag }}
      version: ${{ steps.plan.outputs.version }}
      upstream_tag: ${{ steps.plan.outputs.upstream_tag }}
      vendor_branch: ${{ steps.plan.outputs.vendor_branch }}
    steps:
      - name: Checkout pointer branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.POINTER }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name 'mfrnd'
          git config user.email 'mfrnd@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --tags --prune --quiet
          git fetch origin --quiet

      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          UPSTREAM_TAG=$(gh api repos/sourcegit-scm/sourcegit/releases/latest --jq '.tag_name')
          echo "Latest upstream release: $UPSTREAM_TAG"
          if ! echo "$UPSTREAM_TAG" | grep -qE '^v[0-9]{4}\.[0-9]+$'; then
            echo "::error::Upstream tag '$UPSTREAM_TAG' is not in vYYYY.NN form; refusing to build."
            exit 1
          fi
          NUM=${UPSTREAM_TAG#v}

          # Already released this upstream version? (--refs drops peeled ^{} lines.)
          EXISTING_TAGS=$(git ls-remote --refs --tags origin "refs/tags/v${NUM}.*" | awk -F/ '{print $NF}')
          EXISTING=$(printf '%s' "$EXISTING_TAGS" | grep -c . || true)
          if [ "$EXISTING" -gt 0 ] && [ "${FORCE:-false}" != "true" ]; then
            echo "A fork release for $UPSTREAM_TAG already exists ($EXISTING tag(s)). Re-run with force=true to rebuild."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Next build number = highest existing build for this upstream + 1.
          MAX=$(printf '%s\n' "$EXISTING_TAGS" | awk -F. '{print $NF}' | sort -n | tail -1)
          BUILD=$(( ${MAX:-0} + 1 ))
          {
            echo "should_release=true"
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "vendor_branch=vendor/${UPSTREAM_TAG}"
            echo "fork_tag=v${NUM}.${BUILD}"
            echo "version=${NUM}.${BUILD}"
          } >> "$GITHUB_OUTPUT"
          echo "Planning v${NUM}.${BUILD} from vendor/${UPSTREAM_TAG} (upstream $UPSTREAM_TAG)."

      - name: Ensure vendor branch, then tag
        if: steps.plan.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ steps.plan.outputs.upstream_tag }}
          VENDOR_BRANCH: ${{ steps.plan.outputs.vendor_branch }}
          FORK_TAG: ${{ steps.plan.outputs.fork_tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "refs/heads/${VENDOR_BRANCH}" >/dev/null 2>&1; then
            # A human (or a prior clean run) already produced this vendor branch.
            echo "${VENDOR_BRANCH} already exists; building from it."
            git checkout -B "$VENDOR_BRANCH" "origin/${VENDOR_BRANCH}"
          else
            # Rebase the pointer's patches onto the new upstream tag.
            git checkout -B "$VENDOR_BRANCH" "origin/${POINTER}"
            BASE=$(git merge-base HEAD upstream/master)
            echo "Replaying $(git rev-list --count "$BASE"..HEAD) patch commit(s) from ${POINTER} onto $UPSTREAM_TAG."
            if ! git rebase --onto "$UPSTREAM_TAG" "$BASE" HEAD; then
              git rebase --abort || true
              TITLE="Auto-rebase onto ${UPSTREAM_TAG} failed"
              EXISTING_ISSUE=$(gh issue list --state open --limit 200 --json title --jq '.[].title' | grep -Fx "$TITLE" || true)
              if [ -z "$EXISTING_ISSUE" ]; then
                # REST endpoint, not `gh issue create` (its GraphQL createIssue is
                # denied to the Actions token even with issues:write).
                BODY=$'The scheduled rebase of the `'"${POINTER}"$'` patches onto upstream `'"$UPSTREAM_TAG"$'` hit conflicts; no `'"$VENDOR_BRANCH"$'` was produced and no release was made.\n\nResolve locally, then the daily job builds + releases it and advances `released`:\n```\ngit fetch upstream --tags\ngit fetch origin '"${POINTER}"'\ngit checkout -b '"$VENDOR_BRANCH"' origin/'"${POINTER}"'\ngit rebase --onto '"$UPSTREAM_TAG"' $(git merge-base HEAD upstream/master) HEAD\n# fix conflicts, then\ngit push origin '"$VENDOR_BRANCH"'\n```'
                gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues" \
                  -f "title=$TITLE" -f "body=$BODY" >/dev/null \
                  || echo "::warning::Could not create tracking issue."
              fi
              echo "::error::Rebase onto $UPSTREAM_TAG failed; see the tracking issue."
              exit 1
            fi
            git push origin "HEAD:refs/heads/${VENDOR_BRANCH}"
          fi

          # Tag a detached version-bump commit on top of the vendor branch, so the
          # vendor branch itself stays a clean patch set.
          git checkout --detach
          echo "$VERSION" > VERSION
          git commit -am "chore(release): $FORK_TAG"
          git tag -a "$FORK_TAG" -m "$FORK_TAG — uncommitted-in-history fork on upstream $UPSTREAM_TAG"
          git push origin "refs/tags/$FORK_TAG"

  build:
    name: Build
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.fork_tag }}

  package:
    name: Package
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  release:
    name: Publish release
    needs: [prepare, package]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: package.*
          path: packages
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.fork_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --latest \
            --notes "Automated build of the uncommitted-in-history fork on upstream \`$UPSTREAM_TAG\`." \
            packages/*

      - name: Refresh Scoop bucket
        # Needs a PAT with actions:write on mfrnd/scoop-bucket (BUCKET_DISPATCH_TOKEN);
        # without it this no-ops and the daily Excavator run catches up.
        env:
          GH_TOKEN: ${{ secrets.BUCKET_DISPATCH_TOKEN }}
        run: |
          if [ -n "${GH_TOKEN:-}" ]; then
            gh workflow run Excavator --repo mfrnd/scoop-bucket \
              && echo "Triggered scoop-bucket Excavator." \
              || echo "::warning::Could not trigger scoop-bucket Excavator."
          else
            echo "BUCKET_DISPATCH_TOKEN not set; skipping bucket refresh (daily Excavator will catch up)."
          fi

  advance-pointer:
    name: Advance released pointer
    needs: [prepare, release]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Move released -> vendor branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VENDOR_BRANCH: ${{ needs.prepare.outputs.vendor_branch }}
        run: |
          set -euo pipefail
          # The release succeeded, so this vendor branch is now the last known-good.
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${VENDOR_BRANCH}" --jq '.object.sha')
          echo "Advancing ${POINTER} -> ${VENDOR_BRANCH} (${SHA})."
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${POINTER}" \
            -f "sha=${SHA}" -F force=true >/dev/null
