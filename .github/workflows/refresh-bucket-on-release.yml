name: Refresh Scoop bucket (manual releases)
# Covers releases produced by the upstream-style Release workflow (release.yml),
# which fires on a manually pushed v* tag and runs under GITHUB_TOKEN — so it
# can't dispatch a workflow in another repo itself. When it finishes, refresh the
# scoop-bucket so its manifest picks up the new release right away.
#
# workflow_run workflows always run from the default branch, so this lives only
# on master: no feature-branch change and nothing in upstream's release.yml to
# conflict on rebase. It fires after Release completes, so the release already
# exists when the bucket's Excavator runs.
#
# The automated release path (auto-rebase-release.yml) triggers the bucket in its
# own release job, and its GITHUB_TOKEN-pushed tags don't run release.yml — so the
# two paths don't overlap.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  refresh:
    name: Trigger scoop-bucket Excavator
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Excavator
        # Needs a PAT with actions:write on mfrnd/scoop-bucket, stored as the
        # BUCKET_DISPATCH_TOKEN secret. Without it this no-ops and the daily
        # Excavator run catches up.
        env:
          GH_TOKEN: ${{ secrets.BUCKET_DISPATCH_TOKEN }}
        run: |
          if [ -n "${GH_TOKEN:-}" ]; then
            gh workflow run Excavator --repo mfrnd/scoop-bucket \
              && echo "Triggered scoop-bucket Excavator." \
              || echo "::warning::Could not trigger scoop-bucket Excavator."
          else
            echo "BUCKET_DISPATCH_TOKEN not set; skipping bucket refresh (daily Excavator will catch up)."
          fi
